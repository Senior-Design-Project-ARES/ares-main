rover:
  frame_id: rover_base

cameras:
  center:
    video_device: /dev/video2
    camera_frame_id: center_camera_optical_frame
    camera_info_url: "file:///home/ares/.ros/camera_info/center.yaml"
    image_size: [1920, 1080]
    pixel_format: YUYV
    output_encoding: yuv422_yuy2
    tag_frame_prefix: center_tag_
    pose:
      xyz_m: [0.0, 0.0, 0.0]
      rpy_rad: [-1.57079632679, 0.0, -1.57079632679]

apriltag:
  image_transport: raw
  family: 36h11
  size_m: 0.15
  ids: [0, 1, 2, 3, 4, 5]
  max_hamming: 0
  pose_estimation_method: pnp
  profile: false
  detector:
    threads: 1
    decimate: 1.0
    blur: 0.0
    refine: 2
    sharpening: 0.25
    debug: 0

pipeline:
  publish_rate_hz: 30.0
  max_tf_age_sec: 0.25
  camera_priority: [center]
  publish_fused_tag_tfs: true
  fused_tag_frame_prefix: tag_
  publish_tag_pose_array: true
  tag_pose_array_topic: tag_poses
  tag_ids_topic: tag_ids

target:
  enabled: true
  frame_id: target
  side_length_m: 0.15
  center_offset_m: -0.075
  max_jump_m: 0.50
  smoothing_alpha: 1.0
  publish_tf: true
  publish_topic: true
  topic: target_pose
  use_tag_ids: [0, 1, 2, 3, 4, 5]
